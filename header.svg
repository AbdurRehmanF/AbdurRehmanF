<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Abdur Rehman Farooqi — Full-Stack and Frontend Developer</title>
  <desc id="desc">A midnight-blue workspace with gently floating web, mobile and desktop interfaces connected by animated blue signals. React, Next.js, Node.js, React Native and Electron.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#08111f"/><stop offset="1" stop-color="#10213a"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#59a8ff"/><stop offset="1" stop-color="#8de6d5"/></linearGradient>
    <linearGradient id="panel" x2="0" y2="1"><stop stop-color="#18324f"/><stop offset="1" stop-color="#0d1e34"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#2675be" stop-opacity=".26"/><stop offset="1" stop-color="#2675be" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M 36 0 H 0 V 36" fill="none" stroke="#98b6db" stroke-opacity=".055"/></pattern>
    <clipPath id="bounds"><rect width="1200" height="430" rx="24"/></clipPath>
  </defs>
  <style>
    text{font-family:Segoe UI,Arial,sans-serif} .mono{font-family:Consolas,Menlo,monospace}
    .web{animation:float 7s ease-in-out infinite} .phone{animation:float 7s ease-in-out -2.3s infinite} .terminal{animation:float 7s ease-in-out -4.6s infinite}
    .signal{stroke-dasharray:6 15;animation:flow 6s linear infinite} .pulse{animation:pulse 4s ease-in-out infinite} .cursor{animation:blink 1.4s steps(1) infinite}
    .trace{stroke-dasharray:420;stroke-dashoffset:420;animation:draw 7s ease-in-out infinite}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
    @keyframes flow{to{stroke-dashoffset:-126}}
    @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
    @keyframes blink{0%,55%{opacity:1}56%,100%{opacity:.15}}
    @keyframes draw{0%,12%{stroke-dashoffset:420}55%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:-420}}
    @media(prefers-reduced-motion:reduce){.web,.phone,.terminal,.signal,.pulse,.cursor,.trace{animation:none}.trace{stroke-dashoffset:0}}
  </style>
  <g clip-path="url(#bounds)">
    <rect width="1200" height="430" fill="url(#bg)"/>
    <rect width="1200" height="430" fill="url(#grid)"/>
    <ellipse cx="935" cy="205" rx="370" ry="310" fill="url(#glow)"/>
    <path d="M0 429H1200" stroke="url(#accent)" stroke-opacity=".6" stroke-width="2"/>
    <path d="M600 42V388" stroke="#48627e" stroke-opacity=".25"/>
    <text x="56" y="60" fill="#8ac4ff" font-size="15" letter-spacing="2.5" class="mono">FULL-STACK + FRONTEND</text>
    <text x="52" y="148" fill="#f5f8fc" font-size="64" font-weight="700" letter-spacing="-2">Abdur Rehman</text>
    <text x="52" y="220" fill="#f5f8fc" font-size="64" font-weight="700" letter-spacing="-2">Farooqi<tspan fill="#83dfcf">.</tspan></text>
    <text x="56" y="268" fill="#b8c8dc" font-size="21">React · Next.js · Node.js</text>
    <text x="56" y="299" fill="#8ea5bf" font-size="18">React Native &amp; Electron</text>
    <g font-size="13" letter-spacing="1.6" class="mono">
      <rect x="56" y="337" width="91" height="34" rx="17" fill="#15324d" stroke="#2d5b85"/>
      <text x="80" y="359" fill="#c5e2ff">WEB</text>
      <rect x="159" y="337" width="116" height="34" rx="17" fill="#15324d" stroke="#2d5b85"/>
      <text x="180" y="359" fill="#c5e2ff">MOBILE</text>
      <rect x="287" y="337" width="130" height="34" rx="17" fill="#15324d" stroke="#2d5b85"/>
      <text x="307" y="359" fill="#c5e2ff">DESKTOP</text>
    </g>
    <text x="653" y="57" fill="#7794b4" font-size="12" letter-spacing="2" class="mono">FROM INTERFACE TO APPLICATION</text>
    <path d="M714 260V354H920V300M860 140H1090V292" fill="none" stroke="#3d6590" stroke-width="1.5"/>
    <path class="signal" d="M714 260V354H920V300M860 140H1090V292" fill="none" stroke="#7bdccf" stroke-opacity=".8" stroke-width="2"/>
    <g class="web">
      <rect x="720" y="89" width="390" height="218" rx="13" fill="#050e1c" opacity=".35"/>
      <rect x="710" y="80" width="390" height="218" rx="13" fill="url(#panel)" stroke="#44698f"/>
      <path d="M710 115H1100" stroke="#38536f"/>
      <circle cx="730" cy="98" r="3" fill="#82dfd0"/><circle cx="743" cy="98" r="3" fill="#537fa7"/><circle cx="756" cy="98" r="3" fill="#537fa7"/>
      <rect x="817" y="91" width="155" height="13" rx="6.5" fill="#0c1b2c"/>
      <path d="M768 115V298" stroke="#38536f"/>
      <rect x="727" y="136" width="24" height="5" rx="2.5" fill="#71b4fb"/>
      <path d="M727 157H749M727 176H749M727 195H742" stroke="#51718e" stroke-width="4" stroke-linecap="round"/>
      <rect x="788" y="135" width="124" height="8" rx="4" fill="#c8ddef"/>
      <rect x="788" y="155" width="218" height="5" rx="2.5" fill="#476b8d"/>
      <rect x="788" y="179" width="85" height="47" rx="7" fill="#214a71"/><rect x="883" y="179" width="85" height="47" rx="7" fill="#1c3c5a"/><rect x="978" y="179" width="99" height="47" rx="7" fill="#1a3a50"/>
      <path d="M803 204H855M898 204H950M993 204H1058" stroke="#73b3ee" stroke-width="5" stroke-linecap="round" opacity=".65"/>
      <path d="M789 272L825 263L851 270L886 246L915 254L955 241L984 252L1024 236L1076 242" fill="none" stroke="#406987" stroke-width="2"/>
      <path class="trace" d="M789 272L825 263L851 270L886 246L915 254L955 241L984 252L1024 236L1076 242" fill="none" stroke="#83dfcf" stroke-width="2.5"/>
    </g>
    <g class="phone">
      <rect x="657" y="170" width="111" height="190" rx="19" fill="#0a1422" stroke="#7ca4c8" stroke-width="1.5"/>
      <rect x="665" y="179" width="95" height="172" rx="13" fill="#142b43"/>
      <rect x="694" y="184" width="36" height="5" rx="2.5" fill="#081421"/>
      <circle cx="712" cy="228" r="20" fill="#254d6d"/>
      <circle class="pulse" cx="712" cy="228" r="13" fill="none" stroke="#88e2d2" stroke-width="2"/>
      <path d="M707 228L711 232L718 224" fill="none" stroke="#a9eee2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M683 267H742M683 279H731M683 291H738" stroke="#577f9f" stroke-width="4" stroke-linecap="round"/>
      <rect x="681" y="312" width="64" height="19" rx="9.5" fill="#386b99"/>
      <path d="M698 341H726" stroke="#59768f" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g class="terminal">
      <rect x="837" y="270" width="310" height="111" rx="10" fill="#081625" stroke="#547496"/>
      <path d="M837 297H1147" stroke="#344e68"/>
      <circle cx="852" cy="284" r="3" fill="#8de3d4"/>
      <text x="866" y="288" class="mono" fill="#7f9db9" font-size="10" letter-spacing="1">THE BUILD SPACE</text>
      <text x="855" y="322" class="mono" fill="#77c6ff" font-size="13">&gt; web + mobile + desktop</text>
      <text x="855" y="347" class="mono" fill="#b2c6da" font-size="12">interfaces. APIs. data.</text>
      <rect class="cursor" x="1030" y="337" width="7" height="13" fill="#8de3d4"/>
    </g>
    <circle class="pulse" cx="1112" cy="57" r="3.5" fill="#8de3d4"/>
    <text x="56" y="405" fill="#617e9e" font-size="11" letter-spacing="1.8" class="mono">ABDURREHMANF / GITHUB</text>
  </g>
</svg>
